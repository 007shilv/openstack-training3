[DEFAULT]
enabled_apis = osapi_compute,metadata
transport_url = rabbit://openstack:<URL_ENCODED_DB_PASSWORD>@controller
my_ip = 192.168.234.151
use_neutron = true
firewall_driver = nova.virt.firewall.NoopFirewallDriver

[api_database]
connection = mysql+pymysql://nova:<URL_ENCODED_DB_PASSWORD>@127.0.0.1/nova_api

[database]
connection = mysql+pymysql://nova:<URL_ENCODED_DB_PASSWORD>@127.0.0.1/nova

[api]
auth_strategy = keystone

[keystone_authtoken]
www_authenticate_uri = http://controller:5000/
auth_url = http://controller:5000/
memcached_servers = controller:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = nova
password = <SERVICE_PASSWORD>

[service_user]
send_service_user_token = true
auth_url = http://controller:5000/v3
auth_strategy = keystone
auth_type = password
project_domain_name = Default
project_name = service
user_domain_name = Default
username = nova
password = <SERVICE_PASSWORD>

[vnc]
enabled = true
server_listen = $my_ip
server_proxyclient_address = $my_ip
novncproxy_base_url = http://controller:6080/vnc_auto.html

[glance]
api_servers = http://controller:9292

[oslo_concurrency]
lock_path = /var/lib/nova/tmp

[placement]
region_name = RegionOne
project_domain_name = Default
project_name = service
auth_type = password
user_domain_name = Default
auth_url = http://controller:5000/v3
username = placement
password = <SERVICE_PASSWORD>

[neutron]
auth_url = http://controller:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
region_name = RegionOne
project_name = service
username = neutron
password = <SERVICE_PASSWORD>
service_metadata_proxy = true
metadata_proxy_shared_secret = <SERVICE_PASSWORD>

[scheduler]
discover_hosts_in_cells_interval = 300

[cinder]
os_region_name = RegionOne
