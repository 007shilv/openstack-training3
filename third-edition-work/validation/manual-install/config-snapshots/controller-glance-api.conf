# Sanitized Task 5C snapshot. Never paste a literal password into tracked files.
# <DB_PASSWORD> denotes urllib.parse.quote(runtime_password, safe="").

[DEFAULT]
enabled_backends = file:file

[database]
connection = mysql+pymysql://glance:<DB_PASSWORD>@127.0.0.1/glance

[keystone_authtoken]
www_authenticate_uri = http://controller:5000
auth_url = http://controller:5000
memcached_servers = controller:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = glance
password = <SERVICE_PASSWORD>

[paste_deploy]
flavor = keystone

[glance_store]
default_backend = file

[file]
filesystem_store_datadir = /var/lib/glance/images/
