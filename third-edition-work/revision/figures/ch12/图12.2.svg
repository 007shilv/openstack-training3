<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>text{font-family:"Times New Roman","SimSun","宋体",serif;font-size:36px;fill:#111827} .title{font-size:46px;font-weight:700} .node-title{font-size:40px;font-weight:700} .sub{font-size:36px;fill:#4b5563} .white{fill:#fff}</style>
<defs><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker><marker id="green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker><marker id="purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="70" text-anchor="middle" class="title">Swift对象请求过程</text>
<line x1="390" y1="395" x2="450" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<line x1="770" y1="395" x2="830" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<line x1="1150" y1="395" x2="1210" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<rect x="70" y="245" width="320" height="300" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
<text x="230.0" y="384.0" text-anchor="middle" class="node-title">客户端</text>
<text x="230.0" y="430.0" text-anchor="middle">上传或读取对象</text>
<rect x="450" y="245" width="320" height="300" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
<text x="610.0" y="384.0" text-anchor="middle" class="node-title">Keystone</text>
<text x="610.0" y="430.0" text-anchor="middle">签发访问令牌</text>
<rect x="830" y="245" width="320" height="300" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
<text x="990.0" y="384.0" text-anchor="middle" class="node-title">代理服务</text>
<text x="990.0" y="430.0" text-anchor="middle">依据Ring路由</text>
<rect x="1210" y="245" width="320" height="300" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
<text x="1370.0" y="384.0" text-anchor="middle" class="node-title">存储服务</text>
<text x="1370.0" y="430.0" text-anchor="middle">读写XFS数据</text>
<text x="800" y="720" text-anchor="middle" class="sub">认证决定访问权限，Ring决定后端位置，存储服务保存对象</text>
</svg>