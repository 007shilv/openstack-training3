<line x1="770" y1="395" x2="830" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<line x1="1150" y1="395" x2="1210" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<rect x="70" y="245" width="320" height="300" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
<text x="230.0" y="384.0" text-anchor="middle" class="title">数据库与身份</text>
