<line x1="740" y1="330" x2="860" y2="330" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<line x1="860" y1="500" x2="740" y2="500" stroke="#16a34a" stroke-width="5" marker-end="url(#green)"/>
<text x="800" y="815" text-anchor="middle" class="sub">元数据描述对象与关系，后端保存实际资源数据</text>
