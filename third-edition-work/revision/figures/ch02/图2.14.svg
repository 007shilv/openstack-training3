  <path d="M220 345 V400 M600 345 V400 M980 345 V400" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <path d="M220 520 C220 585 450 580 505 600 M600 520 V590 M980 520 C980 585 750 580 695 600" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="420" y="580" width="360" height="90" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
  <text x="600" y="620" text-anchor="middle" font-size="34" font-weight="700">有依据的选择</text>
  <text x="600" y="658" text-anchor="middle" font-size="34" font-weight="700">与退出方案</text>
