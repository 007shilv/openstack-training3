  <rect x="420" y="90" width="360" height="90" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="148" text-anchor="middle" font-size="34" font-weight="700">业务需求与约束</text>
  <path d="M600 183 V220" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <g>
    <rect x="70" y="230" width="300" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="220" y="278" text-anchor="middle" font-size="34" font-weight="700">定位</text><text x="220" y="323" text-anchor="middle" font-size="34">先解决什么</text>
    <rect x="450" y="230" width="300" height="110" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
    <text x="600" y="278" text-anchor="middle" font-size="34" font-weight="700">服务能力</text><text x="600" y="323" text-anchor="middle" font-size="34">链路是否完整</text>
    <rect x="830" y="230" width="300" height="110" rx="18" fill="#f0fdfa" stroke="#5eead4" stroke-width="3"/>
    <text x="980" y="278" text-anchor="middle" font-size="34" font-weight="700">生态</text><text x="980" y="323" text-anchor="middle" font-size="34">软硬件与人才</text>
    <rect x="70" y="405" width="300" height="110" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
    <text x="220" y="453" text-anchor="middle" font-size="34" font-weight="700">部署形态</text><text x="220" y="498" text-anchor="middle" font-size="34">资源与控制位置</text>
    <rect x="450" y="405" width="300" height="110" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
    <text x="600" y="453" text-anchor="middle" font-size="34" font-weight="700">锁定风险</text><text x="600" y="498" text-anchor="middle" font-size="34">接口数据与退出</text>
