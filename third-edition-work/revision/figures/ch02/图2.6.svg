  <text x="510" y="160" text-anchor="middle" font-size="34">身份·权限</text><text x="745" y="160" text-anchor="middle" font-size="34">监控·计量</text><text x="970" y="160" text-anchor="middle" font-size="34">预算·策略</text>
  <path d="M600 203 V231" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="105" y="235" width="990" height="105" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
