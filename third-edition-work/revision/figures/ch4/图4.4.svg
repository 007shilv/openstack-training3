<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>text{font-family:"SimSun","宋体",serif;font-size:36px;fill:#111827} .title{font-size:46px;font-weight:700} .sub{font-size:36px;fill:#4b5563} .white{fill:#fff}</style>
<defs><marker id="blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#2563eb"/></marker><marker id="green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#16a34a"/></marker><marker id="purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#9333ea"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="70" text-anchor="middle" class="title">控制节点与计算节点组件分布</text>
<rect x="70" y="120" width="690" height="650" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
<text x="415.0" y="342.0" text-anchor="middle" class="title">controller 控制节点</text>
<text x="415.0" y="388.0" text-anchor="middle">MariaDB　RabbitMQ　Memcached</text>
<text x="415.0" y="434.0" text-anchor="middle">Keystone　Glance　Placement</text>
<text x="415.0" y="480.0" text-anchor="middle">Nova控制服务　Neutron控制服务</text>
<text x="415.0" y="526.0" text-anchor="middle">Cinder API/Scheduler　Swift Proxy</text>
<text x="415.0" y="572.0" text-anchor="middle">Horizon　Apache</text>
<rect x="840" y="120" width="690" height="650" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
<text x="1185.0" y="342.0" text-anchor="middle" class="title">compute 计算节点</text>
<text x="1185.0" y="388.0" text-anchor="middle">KVM　libvirt　nova-compute</text>
<text x="1185.0" y="434.0" text-anchor="middle">Neutron Linux Bridge代理</text>
<text x="1185.0" y="480.0" text-anchor="middle">Cinder Volume（/dev/sdb）</text>
<text x="1185.0" y="526.0" text-anchor="middle">Swift存储服务（/dev/sdc）</text>
<text x="1185.0" y="572.0" text-anchor="middle">实例与虚拟网络</text>
<line x1="760" y1="300" x2="840" y2="300" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<line x1="840" y1="430" x2="760" y2="430" stroke="#9333ea" stroke-width="5" marker-end="url(#purple)"/>
<text x="800" y="835" text-anchor="middle" class="sub">控制节点保存状态并作出决策；计算节点报告资源并执行任务</text>
</svg>