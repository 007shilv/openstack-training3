<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>text { font-family: SimSun, '宋体', serif; fill: #111827; }</style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-size="44" font-weight="700">2024年我国云计算市场结构</text>
  <rect x="90" y="95" width="1020" height="100" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="350" y="158" text-anchor="middle" font-size="34">市场总规模</text>
  <text x="650" y="158" text-anchor="middle" font-size="44" font-weight="700" fill="#2563eb">8288亿元</text>
  <text x="930" y="158" text-anchor="middle" font-size="34">同比增长34.4%</text>
  <text x="600" y="245" text-anchor="middle" font-size="34" font-weight="700">按部署形态</text>
  <rect x="90" y="275" width="740" height="105" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="270" y="342" text-anchor="middle" font-size="34">公有云</text>
  <text x="550" y="342" text-anchor="middle" font-size="44" font-weight="700">6216亿元</text>
  <text x="735" y="342" text-anchor="middle" font-size="34">36.6%</text>
  <rect x="850" y="275" width="260" height="105" rx="16" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="3"/>
  <text x="980" y="322" text-anchor="middle" font-size="34">私有云</text>
  <text x="980" y="365" text-anchor="middle" font-size="34" font-weight="700">2072亿元</text>
  <text x="600" y="445" text-anchor="middle" font-size="34" font-weight="700">公有云按服务层次</text>
  <g>
    <rect x="90" y="480" width="320" height="145" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="250" y="538" text-anchor="middle" font-size="34">IaaS</text>
    <text x="250" y="594" text-anchor="middle" font-size="44" font-weight="700">4201亿元</text>
    <rect x="440" y="480" width="320" height="145" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
    <text x="600" y="538" text-anchor="middle" font-size="34">PaaS</text>
    <text x="600" y="594" text-anchor="middle" font-size="34" font-weight="700">突破1000亿元</text>
    <rect x="790" y="480" width="320" height="145" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
    <text x="950" y="538" text-anchor="middle" font-size="34">SaaS</text>
    <text x="950" y="594" text-anchor="middle" font-size="34" font-weight="700">682亿元·增长23.1%</text>
  </g>
  <text x="600" y="675" text-anchor="middle" font-size="34" fill="#6b7280">资料来源：中国信通院；图中均为2024年实际数据</text>
</svg>
