<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>text{font-family:"SimSun","宋体",serif;font-size:36px;fill:#111827} .title{font-size:46px;font-weight:700} .sub{font-size:36px;fill:#4b5563} .white{fill:#fff}</style>
<defs><marker id="blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#2563eb"/></marker><marker id="green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#16a34a"/></marker><marker id="purple" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#9333ea"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="70" text-anchor="middle" class="title">Keystone认证与服务发现</text>
<rect x="70" y="245" width="338" height="300" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
<text x="239.0" y="384.0" text-anchor="middle" class="title">OpenStackClient</text>
<text x="239.0" y="430.0" text-anchor="middle">提交凭据</text>
<line x1="408" y1="395" x2="443" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<rect x="443" y="245" width="338" height="300" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
<text x="612.0" y="361.0" text-anchor="middle" class="title">Keystone</text>
<text x="612.0" y="407.0" text-anchor="middle">认证并签发令牌</text>
<text x="612.0" y="453.0" text-anchor="middle">返回服务目录</text>
<line x1="781" y1="395" x2="816" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<rect x="816" y="245" width="338" height="300" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
<text x="985.0" y="384.0" text-anchor="middle" class="title">业务服务端点</text>
<text x="985.0" y="430.0" text-anchor="middle">Glance / Nova / Neutron</text>
<line x1="1154" y1="395" x2="1189" y2="395" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
<rect x="1189" y="245" width="338" height="300" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
<text x="1358.0" y="361.0" text-anchor="middle" class="title">策略处理</text>
<text x="1358.0" y="407.0" text-anchor="middle">依据角色与作用域</text>
<text x="1358.0" y="453.0" text-anchor="middle">执行业务请求</text>
<text x="800" y="720" text-anchor="middle" class="sub">Keystone建立统一身份，业务服务仍负责自己的资源操作</text>
</svg>